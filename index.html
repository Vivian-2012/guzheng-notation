<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古筝简谱库 · 搜索查谱</title>
<style>
  :root{--bg:#f6f4ef;--card:#fff;--ink:#2a2420;--muted:#8a8178;--line:#e7e1d6;--accent:#b4622f;--accent-d:#8f4a21;--gold:#c99a4a;--red:#dc2626}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 48px}
  .topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:6px;font-size:13px}
  .brand{text-align:center;margin-bottom:18px}
  .brand h1{font-size:25px;letter-spacing:1px}
  .brand p{color:var(--muted);font-size:14px;margin-top:4px}
  .btn{font-size:14px;font-weight:600;padding:9px 16px;border:none;border-radius:10px;cursor:pointer;background:var(--accent);color:#fff}
  .btn:hover{background:var(--accent-d)}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.sm{padding:6px 12px;font-size:13px}
  .searchbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 10px}
  .searchbar input{width:100%;font-size:16px;padding:13px 16px;border:1px solid var(--line);border-radius:14px;outline:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .searchbar input:focus{border-color:var(--accent)}
  .count{color:var(--muted);font-size:13px;margin:2px 2px 12px}
  .list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .song{position:relative;display:flex;flex-direction:column;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:.15s}
  .song:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.08);border-color:var(--accent)}
  .song h2{font-size:18px;margin-bottom:8px;padding-right:22px}
  .song .meta{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tag{background:#f1ebe0;color:var(--accent-d);border-radius:20px;padding:2px 9px;font-size:11px}
  .pages-badge{margin-left:auto;color:var(--muted);font-size:12px}
  .del{position:absolute;top:10px;right:10px;border:none;background:transparent;color:#c0392b;font-size:15px;cursor:pointer;display:none}
  .admin .del{display:block}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
  /* reader */
  .reader{position:fixed;inset:0;background:#20201e;display:none;flex-direction:column;z-index:50}
  .reader.on{display:flex}
  .rhead{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#2b2a27;color:#f3eee5}
  .rhead .title{font-size:16px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rhead button{background:#3b3a36;color:#f3eee5;border:none;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
  .rhead button:hover{background:#4a4843}
  .rstage{position:relative;flex:1;overflow:auto;padding:16px}
  .rcontent{display:flex;align-items:flex-start;justify-content:center;min-height:100%}
  .rstage img,.rstage canvas{max-width:100%;height:auto;background:#fff;border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  /* 卷页动画用的覆盖 canvas */
  #flipCanvas{position:absolute;z-index:6;pointer-events:none;border-radius:4px}
  /* 左右点击翻页区（覆盖在舞台上方，固定在视口） */
  .tap{position:fixed;top:56px;bottom:0;width:38%;z-index:3;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .tap-l{left:0}
  .tap-r{right:0}
  .pagehint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:4;background:rgba(0,0,0,.55);color:#f3eee5;font-size:14px;padding:6px 16px;border-radius:20px;pointer-events:none;transition:opacity .4s;opacity:1}
  .loading{color:#f3eee5;padding:40px;font-size:15px}
  /* overlay/modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding:24px;z-index:60}
  .overlay.on{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:420px;padding:20px}
  .modal h2{font-size:17px;margin-bottom:12px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;outline:none}
  .field input:focus{border-color:var(--accent)}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
  .msg{font-size:13px;min-height:18px}
  .msg.err{color:var(--red)} .msg.ok{color:var(--accent-d)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="btn ghost sm" id="loginBtn">🔐 管理员登录</button>
    <span id="adminInfo" style="display:none;align-items:center;color:var(--accent-d)">
      <span style="margin-right:10px">👤 <span id="adminWho"></span></span>
      <button class="btn sm" id="uploadBtn">＋ 上传谱子</button>
      <a href="#" id="logoutBtn" style="color:var(--muted);margin-left:8px">退出</a>
    </span>
  </div>
  <div class="brand">
    <h1>🎍 古筝简谱库</h1>
    <p>输入曲名搜索 · 点开翻页查看简谱</p>
  </div>
  <div class="searchbar">
    <input id="q" type="search" placeholder="搜索曲名，如「无羁」「女人花」…" autocomplete="off">
  </div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none">没有找到匹配的曲谱 🥲</div>
  <div class="foot">共 <span id="total">0</span> 首 · 简谱仅供学习交流</div>
</div>

<!-- READER -->
<div class="reader" id="reader">
  <div class="rhead">
    <div class="title" id="rTitle"></div>
    <button id="rClose">✕ 关闭</button>
  </div>
  <div class="rstage" id="rStage">
    <div class="rcontent" id="rContent"><div class="loading">加载中…</div></div>
    <div class="tap tap-l" id="tapL" aria-label="上一页"></div>
    <div class="tap tap-r" id="tapR" aria-label="下一页"></div>
    <div class="pagehint" id="rPageInfo">1 / 1</div>
  </div>
</div>

<!-- LOGIN MODAL -->
<div class="overlay" id="loginOverlay">
  <div class="modal">
    <h2>管理员登录</h2>
    <div class="field"><label>邮箱</label><input type="email" id="loginEmail" autocomplete="username" placeholder="you@example.com"></div>
    <div class="field"><label>密码</label><input type="password" id="loginPass" autocomplete="current-password" placeholder="密码"></div>
    <div id="loginErr" class="msg err"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="loginCancel">取消</button>
      <button class="btn" id="loginSubmit">登录</button>
    </div>
  </div>
</div>

<!-- UPLOAD MODAL -->
<div class="overlay" id="uploadOverlay">
  <div class="modal">
    <h2>上传谱子</h2>
    <div class="field"><label>谱子文件（PDF 或图片，可多选；同名不同数字=同一首的多页）</label><input type="file" id="upFiles" accept=".pdf,.jpg,.jpeg,.png" multiple></div>
    <div class="field"><label>标签（逗号分隔，可留空；应用于本次所有曲子）</label><input type="text" id="upTags" placeholder="古风, 抒情"></div>
    <div class="field" id="upRenameWrap" style="display:none"><label>曲名（仅识别到 1 首时可改，留空用文件名）</label><input type="text" id="upTitle" placeholder="留空则用文件名自动识别"></div>
    <div id="upPreview" style="font-size:13px;color:var(--muted);background:#faf7f1;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px;display:none"></div>
    <div id="upMsg" class="msg"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="upCancel">取消</button>
      <button class="btn" id="upSubmit">上传</button>
    </div>
  </div>
</div>

<script src="vendor/pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s);
if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js'; }

/* ====== Supabase 配置（新项目建好后填这两项）====== */
const SB_URL='https://ingpkdlpqyfhprsfkqlg.supabase.co';
const SB_KEY='sb_publishable_tPzts1uKcT1drEN6c4tUWw_2jL150vD';
const BUCKET='guzheng-scores';
const SESS_KEY='guzheng.session';
/* =================================================== */

function pubUrl(name){ return SB_URL+'/storage/v1/object/public/'+BUCKET+'/'+encodeURIComponent(name); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Storage key 只允许 ASCII：保留字母数字，其余去掉；中文名无 ASCII 时用 'score' 兜底
function safeSlug(s){ const t=String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); return t||'score'; }

/* ---------- Auth（复刻参考站逻辑）---------- */
function getSession(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY)||'null'); }catch(e){ return null; } }
function setSession(s){ s?localStorage.setItem(SESS_KEY,JSON.stringify(s)):localStorage.removeItem(SESS_KEY); }
function isAdmin(){ const s=getSession(); return !!(s&&s.access_token); }
function token(){ const s=getSession(); return s?s.access_token:null; }
async function authLogin(email,password){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const d=await r.json();
  if(!r.ok||!d.access_token) throw new Error(d.error_description||d.msg||d.error||'登录失败');
  setSession({access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at,email:(d.user&&d.user.email)||email});
}
function applyAdminUI(){
  const info=$('#adminInfo'), btn=$('#loginBtn');
  if(isAdmin()){
    info.style.display='inline-flex'; btn.style.display='none'; document.body.classList.add('admin');
    const s=getSession(); $('#adminWho').textContent=(s&&s.email)?s.email:'admin';
  }
  else { info.style.display='none'; btn.style.display='inline-flex'; document.body.classList.remove('admin'); }
}

/* ---------- 读曲库 ---------- */
let SONGS=[];
const listEl=$('#list'), emptyEl=$('#empty'), countEl=$('#count');

async function loadSongs(){
  try{
    const r=await fetch(SB_URL+'/rest/v1/scores?select=*&order=title',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+(token()||SB_KEY)}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows=await r.json();
    SONGS=rows.map(r=>({ id:r.id, title:r.title, tags:r.tags||[], files:r.files||[], kind:r.kind||(/(pdf)$/i.test((r.files||[])[0]||'')?'pdf':'image') }));
    SONGS.sort((a,b)=>a.title.localeCompare(b.title,'zh'));
    $('#total').textContent=SONGS.length;
    render(SONGS);
  }catch(e){
    listEl.innerHTML='<div class="empty">曲库加载失败：'+escapeHtml(e.message)+'<br><small>请确认已填好 Supabase 配置并建好 scores 表</small></div>';
  }
}

function render(items){
  listEl.innerHTML='';
  if(items.length===0){ emptyEl.style.display='block'; countEl.textContent=''; return; }
  emptyEl.style.display='none';
  countEl.textContent='找到 '+items.length+' 首';
  items.forEach(song=>{
    const card=document.createElement('div');
    card.className='song';
    const tags=(song.tags||[]).map(t=>'<span class="tag">'+escapeHtml(t)+'</span>').join('');
    const isPdf=song.kind==='pdf';
    card.innerHTML='<button class="del" title="删除">🗑</button>'+
      '<h2>'+escapeHtml(song.title)+'</h2>'+
      '<div class="meta">'+tags+'<span class="pages-badge">'+(isPdf?'PDF · 多页':'图片 · '+song.files.length+' 页')+'</span></div>';
    card.addEventListener('click',e=>{ if(e.target.classList.contains('del')) return; openReader(song); });
    card.querySelector('.del').addEventListener('click',e=>{ e.stopPropagation(); deleteSong(song); });
    listEl.appendChild(card);
  });
}

function filter(){
  const q=$('#q').value.trim().toLowerCase();
  if(!q){ render(SONGS); return; }
  render(SONGS.filter(s=> s.title.toLowerCase().includes(q) || (s.tags||[]).some(t=>t.toLowerCase().includes(q)) ));
}

/* ---------- Reader ---------- */
let R={ song:null, mode:null, page:1, total:1, pdf:null };
function openReader(song){
  R.song=song; R.page=1; R.pdf=null;
  $('#rTitle').textContent=song.title;
  $('#reader').classList.add('on'); document.body.style.overflow='hidden';
  if(song.kind==='pdf'){ R.mode='pdf'; loadPdf(pubUrl(song.files[0])); }
  else { R.mode='img'; R.total=song.files.length; showImgPage(); }
}
function closeReader(){ $('#reader').classList.remove('on'); document.body.style.overflow=''; $('#rContent').innerHTML='<div class="loading">加载中…</div>'; R.pdf=null; }
function showImgPage(){
  $('#rContent').innerHTML='';
  const img=document.createElement('img');
  img.crossOrigin='anonymous';   // 允许卷页动画把图片画到 canvas
  img.src=pubUrl(R.song.files[R.page-1]); img.alt=R.song.title+' 第'+R.page+'页';
  $('#rContent').appendChild(img); updateNav();
}
async function loadPdf(url){
  $('#rContent').innerHTML='<div class="loading">加载 PDF 中…</div>';
  try{ R.pdf=await pdfjsLib.getDocument(url).promise; R.total=R.pdf.numPages; R.page=1; renderPdfPage(); }
  catch(e){ $('#rContent').innerHTML='<div class="loading">PDF 加载失败：'+escapeHtml(e.message)+'</div>'; }
}
async function renderPdfPage(){
  if(!R.pdf) return;
  $('#rContent').innerHTML='<div class="loading">渲染中…</div>';
  const page=await R.pdf.getPage(R.page);
  const stageW=Math.min($('#rStage').clientWidth-32,1100);
  const base=page.getViewport({scale:1});
  const scale=Math.max(1,(stageW/base.width))*1.5;
  const vp=page.getViewport({scale});
  const canvas=document.createElement('canvas');
  canvas.width=vp.width; canvas.height=vp.height; canvas.style.width=(vp.width/1.5)+'px';
  $('#rContent').innerHTML=''; $('#rContent').appendChild(canvas);
  await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
  updateNav();
}
let hintTimer=null;
function updateNav(){
  const hint=$('#rPageInfo');
  hint.textContent=R.page+' / '+R.total;
  hint.style.opacity='1';
  clearTimeout(hintTimer);
  hintTimer=setTimeout(()=>{ hint.style.opacity='0'; },1400);
}

/* 把当前页元素（img/canvas）画成一张 Image + 记录它在舞台内的位置尺寸 */
function snapshotCurrent(){
  const el=$('#rContent').firstElementChild;
  if(!el || (el.tagName!=='IMG' && el.tagName!=='CANVAS')) return null;
  const stage=$('#rStage');
  const er=el.getBoundingClientRect(), sr=stage.getBoundingClientRect();
  return {
    el,
    left:er.left-sr.left+stage.scrollLeft,
    top:er.top-sr.top+stage.scrollTop,
    width:er.width, height:er.height
  };
}

/* page-curl 卷页：d>0 下一页。右下角卷起，沿对角线慢慢往左上翻过去 */
let flipping=false;
async function flipTo(d){
  const np=R.page+d;
  if(np<1||np>R.total||flipping) return;
  const snap=snapshotCurrent();
  // 先拿到旧页位图（在替换前）
  let oldImg=null;
  if(snap){
    oldImg=document.createElement('canvas');
    oldImg.width=Math.max(1,Math.round(snap.width));
    oldImg.height=Math.max(1,Math.round(snap.height));
    try{ oldImg.getContext('2d').drawImage(snap.el,0,0,oldImg.width,oldImg.height); }
    catch(e){ oldImg=null; }
  }
  // 渲染新页到底层
  R.page=np; $('#rStage').scrollTop=0;
  if(R.mode==='img') showImgPage(); else await renderPdfPage();
  if(!oldImg){ return; }
  // 仅对"下一页"做右下角卷起；上一页做反向（左上→右下回卷）
  flipping=true;
  await runCurl(oldImg, snap, d>0);
  flipping=false;
}

/* 用覆盖 canvas 逐帧绘制卷页。forward=true 右下角卷起往左上翻 */
function runCurl(pageCanvas, snap, forward){
  return new Promise(resolve=>{
    const stage=$('#rStage');
    const W=pageCanvas.width, H=pageCanvas.height;
    const cv=document.createElement('canvas');
    cv.id='flipCanvas';
    cv.width=W; cv.height=H;
    cv.style.left=snap.left+'px';
    cv.style.top=snap.top+'px';
    cv.style.width=snap.width+'px';
    cv.style.height=snap.height+'px';
    stage.appendChild(cv);
    const ctx=cv.getContext('2d');
    const dur=520, start=performance.now();
    function frame(now){
      let t=(now-start)/dur; if(t>1)t=1;
      // ease-in-out
      const e=t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
      const p=forward? e : (1-e);
      drawCurl(ctx,pageCanvas,W,H,p);
      if(t<1) requestAnimationFrame(frame);
      else { cv.remove(); resolve(); }
    }
    requestAnimationFrame(frame);
  });
}

/* 绘制进度 p(0..1) 的卷页帧。
   卷起线从右下角(p=0)沿对角线推进到左上(p=1)。
   - 卷起线左上侧：旧页平铺（还没翻到的部分）
   - 右下侧：这部分纸已被掀起并绕卷起线翻折（镜像+外移），显示纸背(带阴影)
   - 底层露出的新页已经画在 rContent 里，这里只画旧页的残留与翻折片 */
function drawCurl(ctx,img,W,H,p){
  ctx.clearRect(0,0,W,H);
  const diag=Math.hypot(W,H);
  // 卷起线参考点：从右下角(W,H)沿对角线(指向左上)前进 p*diag
  const ux=-W/diag, uy=-H/diag;       // 对角线方向(右下→左上)，也是卷折的法线
  const d=p*diag;
  const cx=W+ux*d, cy=H+uy*d;
  const tx=-uy, ty=ux;                 // 卷起线方向(垂直法线)

  // 1) 左上侧旧页平铺
  ctx.save();
  clipHalf(ctx,W,H,cx,cy,ux,uy,+1);
  ctx.clip();
  ctx.drawImage(img,0,0,W,H);
  // 卷起线边缘的投影(落在还没翻的旧页上)
  const shLen=Math.min(60, d*0.4+8);
  const sg=ctx.createLinearGradient(cx,cy,cx+ux*shLen,cy+uy*shLen);
  sg.addColorStop(0,'rgba(0,0,0,.30)');
  sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
  ctx.restore();

  // 2) 翻折片：右下侧的旧页，绕卷起线镜像翻到左上(模拟掀起的纸背)
  const curl=Math.min(W,H)*0.22*Math.sin(Math.PI*Math.min(1,p*1.1));
  drawFoldFlap(ctx,img,W,H,cx,cy,ux,uy,tx,ty,curl);
}

/* 画翻折起来的纸片(旧页右下侧镜像到左上，带纸背阴影与边缘高光) */
function drawFoldFlap(ctx,img,W,H,cx,cy,ux,uy,tx,ty,curl){
  ctx.save();
  // 裁剪：卷起线左上侧(翻折片落点) 且在页面外扩区域
  clipHalf(ctx,W,H,cx,cy,ux,uy,+1);
  ctx.clip();
  // 镜像矩阵：关于过(cx,cy)、方向(tx,ty)的直线做反射
  // 反射公式：对方向 t 的直线反射 = 绕法线取反
  // M = T(c) * Reflect_t * T(-c)
  const a=tx*tx-uy*uy*0; // 用标准反射矩阵
  // 标准：关于单位方向(tx,ty)的直线反射矩阵
  const m00=tx*tx-ty*ty, m01=2*tx*ty, m10=2*tx*ty, m11=ty*ty-tx*tx;
  // 额外沿法线外移 curl，让翻起的纸离开底面一点
  const offx=ux*curl*0.15, offy=uy*curl*0.15;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.translate(cx+offx,cy+offy);
  ctx.transform(m00,m10,m01,m11,0,0);
  ctx.translate(-cx,-cy);
  ctx.globalAlpha=1;
  ctx.drawImage(img,0,0,W,H);
  // 纸背整体压暗 + 顺着卷曲的渐变明暗
  const gx=cx, gy=cy;
  const gg=ctx.createLinearGradient(gx,gy,gx-ux*curl,gy-uy*curl);
  gg.addColorStop(0,'rgba(60,50,40,.05)');
  gg.addColorStop(.5,'rgba(40,32,25,.28)');
  gg.addColorStop(1,'rgba(20,16,12,.5)');
  ctx.fillStyle=gg; ctx.fillRect(0,0,W,H);
  ctx.restore();
  // 翻折边缘高光(贴着卷起线)
  ctx.save();
  clipHalf(ctx,W,H,cx,cy,ux,uy,+1);
  ctx.clip();
  const hg=ctx.createLinearGradient(cx,cy,cx+ux*6,cy+uy*6);
  hg.addColorStop(0,'rgba(255,255,255,.5)');
  hg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hg; ctx.fillRect(0,0,W,H);
  ctx.restore();
}

/* 裁剪出卷起线某一侧（sign=+1 取 u 正方向侧=左上未翻侧） */
function clipHalf(ctx,W,H,cx,cy,ux,uy,sign){
  // 线方向(垂直于u)：tx,ty
  const tx=-uy, ty=ux;
  const big=Math.hypot(W,H)*3;
  const px=cx+tx*big, py=cy+ty*big;
  const qx=cx-tx*big, qy=cy-ty*big;
  const ox=ux*big*sign, oy=uy*big*sign;
  ctx.beginPath();
  ctx.moveTo(px,py); ctx.lineTo(qx,qy);
  ctx.lineTo(qx+ox,qy+oy); ctx.lineTo(px+ox,py+oy);
  ctx.closePath();
}
function go(d){ flipTo(d); }

/* ---------- 上传 ---------- */
async function uploadOne(file, destName){
  const r=await fetch(SB_URL+'/storage/v1/object/'+BUCKET+'/'+encodeURIComponent(destName),{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+token(),'Content-Type':file.type||'application/octet-stream','x-upsert':'true'},
    body:file
  });
  if(!r.ok){ const t=await r.text(); throw new Error('上传失败 '+destName+'：'+t); }
}
async function insertSong(title,tags,files,kind){
  const r=await fetch(SB_URL+'/rest/v1/scores',{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+token(),'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({title,tags,files,kind})
  });
  if(!r.ok){ const t=await r.text(); throw new Error('写入曲库失败：'+t); }
}
async function doUpload(){
  const files=[...$('#upFiles').files];
  const tags=$('#upTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const msg=$('#upMsg'); msg.className='msg';
  if(files.length===0){ msg.className='msg err'; msg.textContent='请选择文件'; return; }
  let groups;
  try{ groups=groupFiles(files); }
  catch(e){ msg.className='msg err'; msg.textContent=e.message; return; }
  // 识别到 1 首时允许用输入框覆盖曲名
  if(groups.length===1){
    const t=$('#upTitle').value.trim();
    if(t) groups[0].title=t;
  }
  $('#upSubmit').disabled=true; msg.className='msg'; msg.textContent='上传中…';
  try{
    let done=0;
    const stamp=Date.now();
    for(const g of groups){
      const names=[];
      const slug=safeSlug(g.title);
      for(let i=0;i<g.files.length;i++){
        const f=g.files[i];
        const ext=(f.name.split('.').pop()||'bin').toLowerCase();
        // Storage key 必须是 ASCII：用 slug + 时间戳 + 页码，避免中文导致 InvalidKey
        const dest=slug+'-'+stamp+'-'+(done+1)+(g.files.length>1?('p'+(i+1)):'')+'.'+ext;
        await uploadOne(f,dest); names.push(dest);
      }
      await insertSong(g.title,tags,names,g.kind);
      done++;
      msg.textContent='上传中… ('+done+'/'+groups.length+')';
    }
    msg.className='msg ok'; msg.textContent='上传成功！共 '+groups.length+' 首';
    setTimeout(()=>{ closeUpload(); loadSongs(); },800);
  }catch(e){ msg.className='msg err'; msg.textContent=e.message; }
  finally{ $('#upSubmit').disabled=false; }
}

/* 根据文件名把文件分组成曲子：
   - 去扩展名、去末尾数字 → 曲名；同名归为一首的多页，组内按数字升序
   - 无数字后缀的各自成一首单页
   - 每个 PDF 各自成一首（多页由 pdf.js 处理） */
function baseName(fn){ return fn.replace(/\.[^.]+$/,''); }   // 去扩展名
function songKey(fn){
  // 去掉末尾的数字（含全角/半角）和可能的分隔符，如「无羁1」「无羁-2」「无羁 第3页」→「无羁」
  return baseName(fn).replace(/[\s_\-]*第?\s*[0-9０-９]+\s*页?$/,'').trim() || baseName(fn);
}
function pageNum(fn){
  const m=baseName(fn).match(/([0-9０-９]+)\s*页?$/);
  if(!m) return 0;
  return parseInt(m[1].replace(/[０-９]/g,d=>'0123456789'['０１２３４５６７８９'.indexOf(d)]),10)||0;
}
function groupFiles(files){
  const pdfs=files.filter(f=>/\.pdf$/i.test(f.name));
  const imgs=files.filter(f=>!/\.pdf$/i.test(f.name));
  const groups=[];
  // PDF：各自一首
  for(const f of pdfs){ groups.push({ title:songKey(f.name), kind:'pdf', files:[f] }); }
  // 图片：按 songKey 分组
  const map=new Map();
  for(const f of imgs){
    const k=songKey(f.name);
    if(!map.has(k)) map.set(k,[]);
    map.get(k).push(f);
  }
  for(const [k,fs] of map){
    fs.sort((a,b)=>{ const d=pageNum(a.name)-pageNum(b.name); return d!==0?d:a.name.localeCompare(b.name,'zh'); });
    groups.push({ title:k, kind:'image', files:fs });
  }
  groups.sort((a,b)=>a.title.localeCompare(b.title,'zh'));
  return groups;
}

/* 选文件后实时预览识别结果 */
function refreshPreview(){
  const files=[...$('#upFiles').files];
  const prev=$('#upPreview'), renameWrap=$('#upRenameWrap');
  if(files.length===0){ prev.style.display='none'; renameWrap.style.display='none'; return; }
  let groups;
  try{ groups=groupFiles(files); }
  catch(e){ prev.style.display='block'; prev.textContent=e.message; return; }
  renameWrap.style.display = groups.length===1 ? 'block' : 'none';
  if(groups.length===1){ $('#upTitle').value=''; $('#upTitle').placeholder='识别为「'+groups[0].title+'」，可改'; }
  prev.style.display='block';
  prev.innerHTML='识别到 <b>'+groups.length+'</b> 首：<br>'+
    groups.map(g=>'· <b>'+escapeHtml(g.title)+'</b>（'+(g.kind==='pdf'?'PDF 多页':g.files.length+' 页')+'）').join('<br>');
}
async function deleteSong(song){
  if(!isAdmin()) return;
  if(!confirm('删除《'+song.title+'》？文件也会从存储删除。')) return;
  try{
    for(const f of song.files){
      await fetch(SB_URL+'/storage/v1/object/'+BUCKET+'/'+encodeURIComponent(f),{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+token()}});
    }
    await fetch(SB_URL+'/rest/v1/scores?id=eq.'+song.id,{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+token()}});
    loadSongs();
  }catch(e){ alert('删除失败：'+e.message); }
}

/* ---------- Modal 开关 ---------- */
function openLogin(){ $('#loginEmail').value=''; $('#loginPass').value=''; $('#loginErr').textContent=''; $('#loginOverlay').classList.add('on'); setTimeout(()=>$('#loginEmail').focus(),50); }
function closeLogin(){ $('#loginOverlay').classList.remove('on'); }
function openUpload(){ $('#upTitle').value=''; $('#upTags').value=''; $('#upFiles').value=''; $('#upMsg').textContent=''; $('#upPreview').style.display='none'; $('#upRenameWrap').style.display='none'; $('#uploadOverlay').classList.add('on'); }
function closeUpload(){ $('#uploadOverlay').classList.remove('on'); }
async function doLogin(){
  const email=$('#loginEmail').value.trim(), pass=$('#loginPass').value;
  if(!email||!pass){ $('#loginErr').textContent='请输入邮箱和密码'; return; }
  $('#loginSubmit').disabled=true; $('#loginSubmit').textContent='登录中…';
  try{ await authLogin(email,pass); closeLogin(); applyAdminUI(); loadSongs(); }
  catch(e){ $('#loginErr').textContent='登录失败：'+e.message; }
  finally{ $('#loginSubmit').disabled=false; $('#loginSubmit').textContent='登录'; }
}

/* ---------- 事件 ---------- */
$('#q').addEventListener('input', filter);
$('#rClose').addEventListener('click', closeReader);
$('#tapL').addEventListener('click', ()=>go(-1));
$('#tapR').addEventListener('click', ()=>go(1));
$('#loginBtn').addEventListener('click', openLogin);
$('#loginSubmit').addEventListener('click', doLogin);
$('#loginCancel').addEventListener('click', closeLogin);
$('#loginOverlay').addEventListener('click', e=>{ if(e.target.id==='loginOverlay') closeLogin(); });
$('#loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
$('#logoutBtn').addEventListener('click', e=>{ e.preventDefault(); setSession(null); applyAdminUI(); });
$('#uploadBtn').addEventListener('click', openUpload);
$('#upFiles').addEventListener('change', refreshPreview);
$('#upCancel').addEventListener('click', closeUpload);
$('#upSubmit').addEventListener('click', doUpload);
$('#uploadOverlay').addEventListener('click', e=>{ if(e.target.id==='uploadOverlay') closeUpload(); });
document.addEventListener('keydown', e=>{
  if($('#reader').classList.contains('on')){
    if(e.key==='Escape') closeReader();
    else if(e.key==='ArrowLeft') go(-1);
    else if(e.key==='ArrowRight') go(1);
  }
});
window.addEventListener('resize', ()=>{ if($('#reader').classList.contains('on')&&R.mode==='pdf') renderPdfPage(); });

/* ---------- 启动 ---------- */
applyAdminUI();
loadSongs();
</script>
