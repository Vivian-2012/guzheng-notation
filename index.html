<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古筝简谱库 · 搜索查谱</title>
<style>
  :root{--bg:#f6f4ef;--card:#fff;--ink:#2a2420;--muted:#8a8178;--line:#e7e1d6;--accent:#b4622f;--accent-d:#8f4a21;--gold:#c99a4a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 48px}
  .brand{text-align:center;margin-bottom:22px}
  .brand h1{font-size:25px;letter-spacing:1px}
  .brand p{color:var(--muted);font-size:14px;margin-top:4px}
  .searchbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 14px}
  .searchbar input{width:100%;font-size:16px;padding:13px 16px;border:1px solid var(--line);border-radius:14px;outline:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .searchbar input:focus{border-color:var(--accent)}
  .count{color:var(--muted);font-size:13px;margin:2px 2px 12px}
  .list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .song{display:flex;flex-direction:column;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:.15s}
  .song:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.08);border-color:var(--accent)}
  .song h2{font-size:18px;margin-bottom:8px}
  .song .meta{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tag{background:#f1ebe0;color:var(--accent-d);border-radius:20px;padding:2px 9px;font-size:11px}
  .pages-badge{margin-left:auto;color:var(--muted);font-size:12px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
  /* reader */
  .reader{position:fixed;inset:0;background:#20201e;display:none;flex-direction:column;z-index:50}
  .reader.on{display:flex}
  .rhead{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#2b2a27;color:#f3eee5;box-shadow:0 1px 6px rgba(0,0,0,.3)}
  .rhead .title{font-size:16px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rhead button{background:#3b3a36;color:#f3eee5;border:none;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
  .rhead button:hover{background:#4a4843}
  .rstage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:16px}
  .rstage img,.rstage canvas{max-width:100%;height:auto;background:#fff;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  .rnav{display:flex;align-items:center;justify-content:center;gap:16px;padding:12px 16px;background:#2b2a27;color:#f3eee5}
  .rnav button{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:11px 22px;font-size:15px;font-weight:600;cursor:pointer}
  .rnav button:hover{background:var(--accent-d)}
  .rnav button:disabled{opacity:.35;cursor:not-allowed}
  .rnav .pageinfo{font-size:15px;min-width:70px;text-align:center}
  .loading{color:#f3eee5;padding:40px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>🎍 古筝简谱库</h1>
    <p>输入曲名搜索 · 点开翻页查看简谱</p>
  </div>
  <div class="searchbar">
    <input id="q" type="search" placeholder="搜索曲名，如「无羁」「女人花」…" autocomplete="off">
  </div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none">没有找到匹配的曲谱 🥲</div>
  <div class="foot">共 <span id="total">0</span> 首 · 简谱仅供学习交流</div>
</div>

<!-- READER -->
<div class="reader" id="reader">
  <div class="rhead">
    <div class="title" id="rTitle"></div>
    <button id="rClose">✕ 关闭</button>
  </div>
  <div class="rstage" id="rStage">
    <div class="loading" id="rLoading">加载中…</div>
  </div>
  <div class="rnav">
    <button id="rPrev">‹ 上一页</button>
    <span class="pageinfo" id="rPageInfo">1 / 1</span>
    <button id="rNext">下一页 ›</button>
  </div>
</div>

<script src="vendor/pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s);
if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js'; }

let SONGS=[];
const listEl=$('#list'), emptyEl=$('#empty'), countEl=$('#count');

function isPdf(f){ return /\.pdf$/i.test(f); }

function pageCountOf(song){
  // 图片类：文件数即页数；PDF：单文件但可能多页，先显示文件数（打开后再细化）
  return song.files.length;
}

function render(items){
  listEl.innerHTML='';
  if(items.length===0){ emptyEl.style.display='block'; countEl.textContent=''; return; }
  emptyEl.style.display='none';
  countEl.textContent='找到 '+items.length+' 首';
  items.forEach(song=>{
    const card=document.createElement('div');
    card.className='song';
    const tags=(song.tags||[]).map(t=>'<span class="tag">'+t+'</span>').join('');
    const kind=isPdf(song.files[0])?'PDF':'图片';
    card.innerHTML='<h2>'+escapeHtml(song.title)+'</h2>'+
      '<div class="meta">'+tags+'<span class="pages-badge">'+kind+' · '+(isPdf(song.files[0])?'多页':song.files.length+' 页')+'</span></div>';
    card.addEventListener('click',()=>openReader(song));
    listEl.appendChild(card);
  });
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function filter(){
  const q=$('#q').value.trim().toLowerCase();
  if(!q){ render(SONGS); return; }
  const res=SONGS.filter(s=>{
    if(s.title.toLowerCase().includes(q)) return true;
    return (s.tags||[]).some(t=>t.toLowerCase().includes(q));
  });
  render(res);
}

/* ---------- Reader ---------- */
let R={ song:null, mode:null, page:1, total:1, pdf:null };

function openReader(song){
  R.song=song; R.page=1; R.pdf=null;
  $('#rTitle').textContent=song.title;
  $('#reader').classList.add('on');
  document.body.style.overflow='hidden';
  if(isPdf(song.files[0])){
    R.mode='pdf';
    loadPdf(song.files[0]);
  } else {
    R.mode='img';
    R.total=song.files.length;
    showImgPage();
  }
}

function closeReader(){
  $('#reader').classList.remove('on');
  document.body.style.overflow='';
  $('#rStage').innerHTML='<div class="loading" id="rLoading">加载中…</div>';
  R.pdf=null;
}

function showImgPage(){
  const f=R.song.files[R.page-1];
  $('#rStage').innerHTML='';
  const img=document.createElement('img');
  img.src=f;
  img.alt=R.song.title+' 第'+R.page+'页';
  $('#rStage').appendChild(img);
  updateNav();
}

async function loadPdf(url){
  $('#rStage').innerHTML='<div class="loading">加载 PDF 中…</div>';
  try{
    const task=pdfjsLib.getDocument(url);
    R.pdf=await task.promise;
    R.total=R.pdf.numPages;
    R.page=1;
    renderPdfPage();
  }catch(e){
    $('#rStage').innerHTML='<div class="loading">PDF 加载失败：'+escapeHtml(e.message)+'</div>';
  }
}

async function renderPdfPage(){
  if(!R.pdf) return;
  $('#rStage').innerHTML='<div class="loading">渲染中…</div>';
  const page=await R.pdf.getPage(R.page);
  const stageW=Math.min($('#rStage').clientWidth-32, 1100);
  const base=page.getViewport({scale:1});
  const scale=Math.max(1, (stageW/base.width))*1.5; // 清晰度
  const viewport=page.getViewport({scale});
  const canvas=document.createElement('canvas');
  canvas.width=viewport.width; canvas.height=viewport.height;
  canvas.style.width=(viewport.width/1.5)+'px';
  const ctx=canvas.getContext('2d');
  $('#rStage').innerHTML='';
  $('#rStage').appendChild(canvas);
  await page.render({canvasContext:ctx, viewport}).promise;
  updateNav();
}

function updateNav(){
  $('#rPageInfo').textContent=R.page+' / '+R.total;
  $('#rPrev').disabled=R.page<=1;
  $('#rNext').disabled=R.page>=R.total;
}

function go(delta){
  const np=R.page+delta;
  if(np<1||np>R.total) return;
  R.page=np;
  $('#rStage').scrollTop=0;
  if(R.mode==='img') showImgPage();
  else renderPdfPage();
}

$('#rClose').addEventListener('click', closeReader);
$('#rPrev').addEventListener('click', ()=>go(-1));
$('#rNext').addEventListener('click', ()=>go(1));
document.addEventListener('keydown', e=>{
  if(!$('#reader').classList.contains('on')) return;
  if(e.key==='Escape') closeReader();
  else if(e.key==='ArrowLeft') go(-1);
  else if(e.key==='ArrowRight') go(1);
});
window.addEventListener('resize', ()=>{ if($('#reader').classList.contains('on') && R.mode==='pdf') renderPdfPage(); });

$('#q').addEventListener('input', filter);

/* ---------- Load data ---------- */
fetch('songs.json').then(r=>r.json()).then(d=>{
  SONGS=(d.songs||[]).sort((a,b)=>a.title.localeCompare(b.title,'zh'));
  $('#total').textContent=SONGS.length;
  render(SONGS);
}).catch(e=>{
  listEl.innerHTML='<div class="empty">曲库加载失败：'+escapeHtml(e.message)+'</div>';
});
</script>
</body>
</html>
